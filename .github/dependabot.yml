version: 2
updates:
  # Rust backend (Cargo.toml + Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps(cargo)"
      include: "scope"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]

  # Base images for the build. All Dockerfiles and compose files live under
  # /docker, not the repo root — Dependabot's docker ecosystem does not
  # recurse into subdirectories, so "directory" must point there directly or
  # these base images are never scanned.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
    # The Postgres image is pinned to a digest on purpose: a new image can make
    # the existing encrypted data volume unreadable, so it is only changed by
    # hand together with the backup/restore procedure in postgres.Dockerfile.
    ignore:
      - dependency-name: "percona/percona-distribution-postgresql"

  # GitHub Actions versions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions)"

  # Svelte/Vite frontend (package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
