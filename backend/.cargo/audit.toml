# cargo-audit configuration.
# See: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing sidechannel in the `rsa` crate.
#
# The `rsa` crate is pulled in transitively by `sqlx-mysql`, which appears
# in our resolved Cargo.lock because the `sqlx` umbrella crate lists it as
# a (feature-gated) dependency. We only enable the `postgres` feature of
# sqlx, so the vulnerable `rsa` code is never compiled into our binary
# (sqlx-mysql is gated behind the disabled `mysql` feature).
#
# There is currently no patched release of `rsa` (the fix requires a
# constant-time bigint implementation that is still in development).
# Re-evaluate once a patched version ships.
#
# RUSTSEC-2024-0370: `proc-macro-error` v1.0.4 is unmaintained.
#
# This is an "unmaintained" advisory (not a vulnerability) for a proc-macro
# crate that runs only at compile time. It is pulled in transitively via:
#   zerf → printpdf → allsorts → ouroboros → proc-macro-error
# `printpdf` (our PDF report renderer) still depends on a version of
# `allsorts` that uses the old `ouroboros` 0.17 line. There is nothing we
# can do at this level without forking `printpdf`. Re-evaluate when
# `printpdf` upgrades its `allsorts` dependency, or when we replace the
# PDF backend. Compile-time-only crate; no runtime attack surface.
#
# RUSTSEC-2026-0459: `libsqlite3-sys` bundles a vulnerable C SQLite.
#
# `libsqlite3-sys` appears in our resolved Cargo.lock only through
# `sqlx-sqlite`, which the `sqlx` umbrella crate lists as a (feature-gated)
# dependency. We enable only the `postgres` driver, so neither crate is
# compiled into the binary (`cargo tree --target all -e all -i libsqlite3-sys`
# prints nothing). The fix needs `libsqlite3-sys` >= 0.39, which the current
# `sqlx-sqlite` release does not allow. Re-evaluate once `sqlx` allows it.
#
# RUSTSEC-2026-0440: `astral-tokio-tar` is unmaintained.
#
# This is an "unmaintained" advisory (not a vulnerability). The crate is pulled
# in only by `testcontainers`, a dev-dependency used by the integration tests
# to start a throwaway Postgres container; it is never part of the shipped
# binary. `testcontainers-modules` still requires `testcontainers` 0.27, so
# the dependency cannot move on its own. Re-evaluate when
# `testcontainers-modules` supports a release without it.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0440",
]
